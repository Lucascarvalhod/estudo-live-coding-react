name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        # --passWithNoTests evita falha enquanto a suíte de testes ainda não
        # foi implementada (ver "Pontos de atenção" em DOCS/arquiteture.md).
        run: yarn test --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Build
        run: yarn build
